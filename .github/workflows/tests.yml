name: tests

# Runs the full CLua test suite (unit / lua / packages / differential /
# conformance / tools suites + differential fuzz smoke) on every push and
# PR. Windows runner: the build is a Windows x64 PE toolchain (MinGW gcc +
# cmd.exe Makefile), so ubuntu is not an option.

on:
  push:
    branches:
      - main
      - claude/speed-and-size
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install MSYS2 (MinGW-w64 UCRT gcc + GNU make)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
          path-type: inherit

      - name: build products
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          make -f build/Makefile compiler clua-interp embedded luac-objs
          make -f build/Makefile.luac aotc aot-entry clua rover sysroot

      - name: run test suite
        shell: cmd
        run: |
          set "PATH=C:\msys64\ucrt64\bin;%PATH%"
          build\bin\clua-interp.exe tools\run-tests.lua
