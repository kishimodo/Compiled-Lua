name: tests

# Runs the full CLua test suite (unit / lua / packages / differential /
# conformance / tools suites + differential fuzz smoke) on every push and
# PR. Windows runner: the build is a Windows x64 PE toolchain (MinGW gcc +
# cmd.exe Makefile), so ubuntu is not an option.

on:
  push:
    branches:
      - main
      - claude/speed-and-size
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install toolchain (mingw gcc + make via chocolatey)
        shell: pwsh
        run: |
          choco install -y --no-progress mingw make

      - name: add toolchain to PATH
        shell: pwsh
        run: |
          # Locate the mingw bin dir dynamically — choco's install layout can
          # vary by package version, so never hardcode it.
          $mingw = Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "x86_64-w64-mingw32-gcc.exe" |
                   Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $mingw) {
            $mingw = Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "gcc.exe" |
                     Select-Object -First 1 -ExpandProperty DirectoryName
          }
          Write-Host "mingw bin: $mingw"
          if (-not $mingw) { throw "mingw gcc not found under C:\ProgramData\mingw64" }
          $make = "C:\ProgramData\chocolatey\bin"
          "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$make"  | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: create triple-prefix shims
        shell: pwsh
        run: |
          # The Makefiles hardcode x86_64-w64-mingw32-{gcc,g++,ld,ar,objcopy},
          # but the choco mingw package does not ship every one under that
          # prefix (ld/ar exist only as bare ld.exe/ar.exe). Copy the real exe
          # under the triple-prefixed name (a .cmd shim can break when make
          # spawns the compiler without a cmd shell).
          $shimDir = "$PWD\_shims"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          # Reuse the dynamically located mingw dir from the previous step.
          $mingw = (Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "gcc.exe" |
                    Select-Object -First 1 -ExpandProperty DirectoryName)
          if (-not $mingw) { throw "mingw bin dir not found" }
          Write-Host "shimming from: $mingw"
          foreach ($pair in @(
            @('x86_64-w64-mingw32-gcc',  'gcc'),
            @('x86_64-w64-mingw32-g++', 'g++'),
            @('x86_64-w64-mingw32-ld',  'ld'),
            @('x86_64-w64-mingw32-ar',  'ar'),
            @('x86_64-w64-mingw32-objcopy', 'objcopy')
          )) {
            # Copy the REAL exe under the triple-prefixed name (a .cmd shim can
            # break when make spawns the compiler without a cmd shell).
            Copy-Item -Path (Join-Path $mingw "$($pair[1]).exe") `
                      -Destination (Join-Path $shimDir "$($pair[0]).exe")
          }
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: build products
        shell: cmd
        run: |
          where make
          where x86_64-w64-mingw32-gcc
          make -f build/Makefile compiler clua-interp embedded luac-objs
          make -f build/Makefile.luac aotc aot-entry clua rover sysroot

      - name: run test suite
        shell: cmd
        run: build\bin\clua-interp.exe tools\run-tests.lua
