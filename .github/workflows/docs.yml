name: docs

# builds the mkdocs site on push to main. does not deploy: this workflow
# stops after `mkdocs build` and uploads the built site as a workflow
# artifact so a maintainer can review it before flipping the deploy
# switch. the deploy step is present but commented out; enable it once
# the built site has been reviewed at least once and the github-pages
# environment has been created for the repo.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # for the future deploy step; keeping the block small until enabled.
  pages: read
  id-token: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install mkdocs and the material theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: build the site
        working-directory: docs/site
        run: mkdocs build --strict --site-dir ../../_site

      - name: upload the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 14

  # deploy is off by default. once the built artifact has been reviewed
  # from at least one successful build run, uncomment this job and turn
  # on github pages for the repo pointing at the gh-pages branch. leaving
  # this commented out keeps the workflow safe to enable in the ci
  # settings without pushing anything anywhere until a human decides.
